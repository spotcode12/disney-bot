<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        .login {
            width: 360px;
            padding: 30px;
            background: #1c1c1c;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,.5);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .subtitulo {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #111;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #e50914;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #e50914;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        .error {
            background: #421818;
            color: #ff7777;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login">

    <h1>🎬 Disney+ Admin</h1>

    <div class="subtitulo">
        Acceso restringido
    </div>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Usuario</label>

        <input
            type="text"
            name="usuario"
            autocomplete="username"
            required
        >

        <label>Contraseña</label>

        <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button type="submit">
            Ingresar
        </button>

    </form>

</div>

</body>
</html>
